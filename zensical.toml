[project]
site_name = "Brownie Safe"
site_url = "https://safe.ape.tax/"
repo_url = "https://github.com/banteg/brownie-safe"
use_directory_urls = false
nav = [
    { "Home" = "index.md" },
    { "Introduction" = "intro.md" },
    { "Quickstart" = "quickstart.md" },
    { "Installation" = "install.md" },
    { "Signing" = "signing.md" },
    { "Detailed example" = "detailed.md" },
    { "Useful links" = "useful.md" },
    { "Changelog" = "changelog.md" },
    { "API docs" = "brownie_safe.md" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
allow_inspection = false
show_root_heading = true
show_if_no_docstring = true
show_source = false

[project.plugins.redirects.redirect_maps]
"genindex.md" = "brownie_safe.md"
"py-modindex.md" = "brownie_safe.md"
"search.md" = "index.md"

