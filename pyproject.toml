[project]
name = "brownie-safe"
version = "0.9.3"
description = "Build complex Gnosis Safe transactions and safely preview them in a forked environment."
authors = [{ name = "banteg" }]
license = "MIT"
readme = "readme.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "eth-brownie==1.22.2",
    # Newer Safe SDK releases require safe-pysha3>=1.0.7; Brownie pins 1.0.5.
    "safe-eth-py==7.26.1",
    "click>=8",
    # Hardware signing uses the client API that trezorlib 0.20 replaced.
    "trezor>=0.13.8,<0.20",
]

[project.urls]
Repository = "https://github.com/banteg/brownie-safe"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["brownie_safe"]

[tool.ruff]
ignore = ['E501']
