[tool.poetry]
name = "brownie-safe"
version = "0.9.3"
description = "Build complex Gnosis Safe transactions and safely preview them in a forked environment."
authors = ["banteg"]
license = "MIT"
repository = "https://github.com/banteg/brownie-safe"
readme = "readme.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
eth-brownie = "1.22.2"
# Newer Safe SDK releases require safe-pysha3>=1.0.7; Brownie pins 1.0.5.
safe-eth-py = "7.26.1"
click = ">=8"
# Hardware signing uses the client API that trezorlib 0.20 replaced.
trezor = ">=0.13.8,<0.20"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
ignore = ['E501']
